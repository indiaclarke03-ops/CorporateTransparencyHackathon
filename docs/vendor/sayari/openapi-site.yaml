      title: NotAcceptableResponse
    resolution_ResolutionBody:
      type: object
      properties:
        name:
          type: array
          items:
            type: string
          description: Entity name
        identifier:
          $ref: '#/components/schemas/generatedTypes_BothIdentifierTypes'
          description: >-
            Entity identifier. Can be from either the [Identifier
            Type](/sayari-library/ontology/enumerated-types#identifier-type) or [Weak Identifier
            Type](/sayari-library/ontology/enumerated-types#weak-identifier-type) enums.
        address:
          type: array
          items:
            type: string
          description: Entity address
        city:
          type: string
          description: Entity city that contains the provided city name.
        state:
          type: string
          description: Entity state that contains the provided state name.
        country:
          type: array
          items:
            $ref: '#/components/schemas/generatedTypes_Country'
          description: >-
            Entity country - must be ISO (3166) Trigram i.e., `USA`. See complete list
            [here](/sayari-library/ontology/enumerated-types#country)
        date_of_birth:
          type: array
          items:
            type: string
          description: Entity date of birth
        contact:
          type: array
          items:
            type: string
          description: Entity contact
        type:
          type: array
          items:
            $ref: '#/components/schemas/generatedTypes_Entities'
          description: >-
            [Entity type](/sayari-library/ontology/entities). If multiple values are passed for any field, the endpoint
            will match entities with ANY of the values.
        profile:
          $ref: '#/components/schemas/resolution_ProfileEnum'
          description: >-
            Specifies the search algorithm to use. `corporate` (default) is optimized for accurate entity attribute
            matching, ideal for business verification. `suppliers` is tailored for matching entities with trade data,
            suitable for supply chain use cases. `search` mimics /search/entity behavior, best for name-only matches.
        name_min_percentage:
          type: integer
          description: >-
            Adding this param enables an alternative matching logic. It will set a minimum percentage of tokens needed
            to match with user input to be considered a "hit". Accepts integers from 0 to 100 inclusive.
        name_min_tokens:
          type: integer
          description: >-
            Adding this param enables an alternative matching logic. It sets the minimum number of matching tokens the
            resolved hits need to have in common with the user input to be considered a "hit". Accepts non-negative
            integers.
        tags:
          type: array
          items:
            type: string
          description: An array of tag labels to associate with each resolved entity
        minimum_score_threshold:
          type: integer
          description: >-
            Specifies the minimum score required to pass, which controls the strictness of the matching threshold. The
            default value is 77, and tuned for general use-case accuracy. Increase the value for stricter matching,
            reduce to loosen.
        search_fallback:
          type: boolean
          description: >-
            Enables a name search fallback when either the corporate or supplier profiles fails to find a match. When
            invoked, the fallback will make a call similar to /search/entity on name only. By default set to false.
        cutoff_threshold:
          type: integer
          description: >-
            Specifies the window of similar results returned in the match group. Increase for fewer multiple matches,
            decrease to open the aperture and allow for more matches. Default is .8
        candidate_pool_size:
          type: integer
          description: >-
            Specifies the maximum number of entity candidates considered during search. Default is 50. Higher values
            increase match pool size but also increase latency.
        skip_post_process:
          type: boolean
          description: >-
            Bypasses the post-processing setps and re-ranking. Useful for debugging. By default set to false, set to
            true to enable.
        enable_llm_clean:
          type: boolean
          description: >-
            Whether to enable LLM-based data cleaning to remove noise and standardize entity attributes. Defaults to
            true if not supplied. Set to false to disable LLM cleaning.
      title: ResolutionBody
