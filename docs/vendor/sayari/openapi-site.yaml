        tier5_shipment_country:
          type: array
          items:
            $ref: '#/components/schemas/generatedTypes_Country'
          description: Filter by upstream (supply chain) [country](/sayari-library/ontology/enumerated-types#country) at tier 5.
        country:
          type: array
          items:
            $ref: '#/components/schemas/generatedTypes_Country'
          description: Filter by [country](/sayari-library/ontology/enumerated-types#country).
        business_purpose:
          type: array
          items:
            type: string
          description: Filter by HS code, HS code description, or business description.
        label:
          $ref: '#/components/schemas/projectEntity_ProjectEntitiesFuzzyFilter'
          description: Filter by entity label with fuzzy matching.
        city:
          $ref: '#/components/schemas/projectEntity_ProjectEntitiesFuzzyFilter'
          description: Filter by entity city with fuzzy matching.
        state:
          $ref: '#/components/schemas/projectEntity_ProjectEntitiesFuzzyFilter'
          description: Filter by entity address state with fuzzy matching.
