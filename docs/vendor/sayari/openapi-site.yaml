        sanctioned:
          type: boolean
          description: >-
            True if the entity has the ["Sanctioned" risk factor](/sayari-library/ontology/risk-factors#sanctioned),
            otherwise false.
        type:
          $ref: '#/components/schemas/generatedTypes_Entities'
          description: The [entity type](/sayari-library/ontology/entities).
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/sharedTypes_Identifier'
        countries:
          type: array
          items:
            $ref: '#/components/schemas/generatedTypes_Country'
          description: Entity [country](/sayari-library/ontology/enumerated-types#country)
        source_count:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/sharedTypes_SourceCountInfo'
          description: Number of records associated with the entity, grouped by source.
        addresses:
