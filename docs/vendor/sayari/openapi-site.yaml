    generatedTypes_BothIdentifierTypes:
      oneOf:
        - $ref: '#/components/schemas/generatedTypes_IdentifierType'
        - $ref: '#/components/schemas/generatedTypes_WeakIdentifierType'
      title: BothIdentifierTypes
    sharedTypes_Identifier:
      type: object
      properties:
        value:
          type: string
        type:
          $ref: '#/components/schemas/generatedTypes_BothIdentifierTypes'
          description: >-
            [Identifier Type](/sayari-library/ontology/enumerated-types#identifier-type) or [Weak Identifier
            Type](/sayari-library/ontology/enumerated-types#weak-identifier-type)
        label:
          type: string
      required:
        - value
        - type
        - label
      description: Identifiers associated with the entity.
      title: Identifier
    sharedTypes_SourceCountInfo:
      type: object
      properties:
        count:
          type: integer
        label:
          type: string
      required:
        - count
        - label
      description: The number of time the entity is referenced by a source.
      title: SourceCountInfo
    sharedTypes_RelationshipCount:
      type: object
      additionalProperties:
        type: integer
      description: Count of related entities for a given [relationship type](/sayari-library/ontology/relationships).
      title: RelationshipCount
    sharedTypes_EntityRegistrationDate:
      type: string
      description: >-
        Type (registered/incorporated/active) and date of the earliest significant activity associated with the entity.
        Will appear as 'Registered YYYY-MM-DD'
      title: EntityRegistrationDate
    sharedTypes_EntityTranslatedLabel:
      type: string
      description: Label in English if available. Translation performed by Sayari.
      title: EntityTranslatedLabel
    sharedTypes_EntityHSCode:
      type: string
      description: Harmonized Tariff Schedule Code associated with the entity/shipment
      title: EntityHSCode
    sharedTypes_ShipmentArrival:
      type: string
      description: Arrival date of a shipment.
      title: ShipmentArrival
    sharedTypes_ShipmentDeparture:
      type: string
      description: Departure date of a shipment.
      title: ShipmentDeparture
    sharedTypes_CompanyType:
      type: string
      description: >-
        A type of legal entity in a given jurisdiction (e.g. 'LLC,' 'Sociedad Anonima,' 'Private Company Limited by
        Shares')
      title: CompanyType
    sharedTypes_Status:
      type: object
      properties:
        status:
          type: string
        date:
          type: string
      required:
        - status
      description: The most recent status of an entity and when that status was observed.
      title: Status
    sharedTypes_RiskValue:
      oneOf:
        - type: string
        - type: number
          format: double
        - type: boolean
      title: RiskValue
    sharedTypes_RiskLevel:
      type: string
      enum:
        - critical
        - high
        - elevated
        - relevant
      title: RiskLevel
    sharedTypes_RiskData:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/sharedTypes_RiskValue'
        metadata:
          type: object
          additionalProperties:
            description: Any type
        level:
          $ref: '#/components/schemas/sharedTypes_RiskLevel'
          description: The severity of the risk.
      required:
        - value
        - metadata
        - level
      title: RiskData
    sharedTypes_EntityRisk:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/sharedTypes_RiskData'
      description: Risk factors associated with the entity.
      title: EntityRisk
    baseTypes_CountQualifier:
      type: string
      enum:
        - eq
        - gte
      title: CountQualifier
    baseTypes_QualifiedCount:
      type: object
      properties:
        count:
          type: integer
        qualifier:
          $ref: '#/components/schemas/baseTypes_CountQualifier'
      required:
        - count
        - qualifier
      title: QualifiedCount
