  /v1/usage:
    get:
      operationId: info_getUsage
      summary: Get Usage
      description: >-
        The usage endpoint provides a simple interface to retrieve information on usage made by your API account. This
        includes both views per API path and credits consumed. The time period for the usage query is also specified in
        the response and whether or not this includes total usage.
      tags:
        - info
      parameters:
        - name: from
          in: query
          description: >-
            An ISO 8601 encoded date string indicating the starting time period to obtain usage stats. In the format
            YYYY-MM-DD
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: >-
            An ISO 8601 encoded date string indicating the ending time period to obtain usage stats. In the format
            YYYY-MM-DD
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/info_UsageResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_BadRequestResponse'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_UnauthorizedResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
