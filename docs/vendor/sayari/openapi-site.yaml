  /v1/negative_news:
    get:
      operationId: negativeNews_NegativeNews
      summary: Negative News
      description: |-
        <Warning>This endpoint is in beta and subject to change</Warning>
        Screens entities against news articles and public records to identify risk-relevant content.
        Leverages machine learning to detect and classify risks across various domains.
        Provides detailed article metadata with risk assessments and direct source references.
      tags:
        - negative_news
      parameters:
        - name: name
          in: query
          description: Target entity name for adverse media screening.
          required: true
          schema:
            type: string
        - name: topic
          in: query
          description: >-
            Risk category filter for targeted screening. Each topic represents a distinct risk domain (e.g.,
            `environmental` for environmental violations, `financial` for financial misconduct).
          required: false
          schema:
            $ref: '#/components/schemas/negativeNews_Topics'
        - name: until
          in: query
          description: >-
            Date cutoff for article inclusion in `YYYY-MM-DD` format. If provided, only articles published after this
            date will be included in results.
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/negativeNews_NegativeNewsResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_BadRequestResponse'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_UnauthorizedResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_NotFoundResponse'
        '429':
          description: Error response with status 429
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_RateLimitResponse'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_InternalServerErrorResponse'
      security:
        - default: []
