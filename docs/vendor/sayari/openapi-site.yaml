    screen_WatchlistAttributeValue:
      type: object
      additionalProperties:
        description: Any type
      description: >-
        A single watchlist attribute record. All fields are string, number, boolean, or null. Most records contain a
        "value" field with the primary string value plus attribute-specific fields (e.g. name records include "context",
        "language", "translated", "transliterated", "from_date", "to_date", "date", "extra"; address records include the
        full Libpostal field set: "city", "state", "country", "postcode", "road", "house", "house_number", "unit", "x",
        "y", "near", "level", "building", "suburb", "island", "po_box", "entrance", "staircase", "category",
        "world_region", "city_district", "metro_station", "country_region", "state_district", "precision_code", plus
        date and extra fields). The "extra" field, when present, is an array of WatchlistKeyValue pairs containing
        supplemental metadata (e.g. source attribution).
      title: WatchlistAttributeValue
    screen_WatchlistKeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value
      description: Key-value pair used in the extra field of attribute records.
      title: WatchlistKeyValue
    screen_WatchlistRiskIntelligenceValue:
      type: object
      properties:
        list:
          type: string
          description: Name of the sanctions or risk list (e.g. "OFAC Specially Designated Nationals (SDN) List").
        type:
          type: string
          description: Risk category (e.g. "sanctions", "export_controls", "pep").
        score:
          type: number
          format: double
          description: Risk score, if provided by the source list.
        reason:
          type: string
          description: Reason for designation or listing.
        program:
          type: string
          description: Sanctions program or sub-program name (e.g. "CUBA", "IRAN").
        authority:
          type: string
          description: Issuing authority (e.g. "OFAC", "Department of the Commerce - International Trade Administration").
        from_date:
          type: string
          description: Date the listing took effect (ISO 8601 date string).
        to_date:
          type: string
          description: Date the listing was removed, if applicable.
        date:
          type: string
          description: Generic date field for sources that do not distinguish from/to dates.
        extra:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistKeyValue'
          description: Supplemental metadata as key-value pairs (e.g. license requirements, federal register notices).
      description: >-
        A single risk intelligence record. Unlike other attribute records, this type does NOT contain a "value" field.
        Risk label information is in the "list" and "program" fields.
      title: WatchlistRiskIntelligenceValue
    screen_WatchlistEntityMatch:
      type: object
      properties:
        entity_reference_id:
          type: string
          description: Unique identifier for the watchlist entity.
        type:
          type: string
          description: Entity type (e.g. "company", "person", "vessel").
        additional_information:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: >-
            Miscellaneous information not covered by other attribute types. Records typically contain "value" and
            optional "type" and "extra" fields.
        address:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: >-
            Physical location descriptions parsed via the Libpostal ontology. Each record contains "value" (full address
            string) plus structured sub-fields: "city", "state", "country", "postcode", "road", "house", "house_number",
            "unit", "x", "y", "near", "level", "building", "suburb", "island", "po_box", "entrance", "staircase",
            "category", "world_region", "city_district", "metro_station", "country_region", "state_district",
            "precision_code", "date", "from_date", "to_date", "language", "translated", "transliterated", and "extra"
            (array of WatchlistKeyValue with source attribution).
        business_purpose:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Text or code (NAICS, NACE, ISIC, etc.) describing what the entity is legally permitted to do or produce.
        company_type:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Legal entity type in a given jurisdiction (e.g. "LLC", "Sociedad Anonima").
        contact:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Contact information such as phone numbers, email addresses, or URLs.
        country:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Country affiliation through residence, nationality, registration, etc.
        date_of_birth:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Birth date of a person. Records typically contain a "value" field with the date string.
        finances:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Financial figures such as share capital (deprecated — use financials).
        financials:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Financial information at a point in time (e.g. revenue, assets).
        gender:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Gender of a person.
        generic:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Placeholder attribute for data that does not fit any other attribute type.
        identifier:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: >-
            ID numbers that uniquely identify an entity when value and type are both considered (e.g. registration
            number, tax ID).
        measurement:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Numerical measurement of an entity dimension using a standard unit.
        monetary_value:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Financial value of an asset (e.g. FOB, CIF values).
        name:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Entity name records. Each record contains at minimum a "value" field with the name string.
        person_status:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Key life events for a person, usually temporal.
        position:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Title or designation associated with a relationship (e.g. "Secretary of the Board").
        risk_intelligence:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistRiskIntelligenceValue'
          description: >-
            Risk or sanctions program data. Records contain structured fields (list, type, program, authority,
            from_date, to_date, score, reason, extra) — there is no "value" field on these records.
        risk_factors:
          type: array
          items:
            type: string
          description: Risk factor umbrella values mapped from Risk Intelligence
        shares:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Shareholding information.
        status:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Status of the entity (e.g. active, dissolved).
        translated_name:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Translated or transliterated name records.
        weak_identifier:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: Identifiers that are not unique on their own and require additional context to disambiguate.
        risk_event:
          type: array
          items:
            $ref: '#/components/schemas/screen_WatchlistAttributeValue'
          description: >-
            Risk events associated with the entity — ESG controversies, enforcement actions, adverse media, etc. Records
            may contain fields such as "category", "subcategory", "event_type", "title", "source_url", "credibility",
            "event_stage", "penalty_and_restriction", and "dismissal_and_clearance".
      required:
        - entity_reference_id
        - type
      description: >-
        The watchlist entity associated with a screening match, as stored at ingestion time. All attribute fields follow
        the Sayari ontology: each is an array of attribute records (WatchlistAttributeValue). All known attribute fields
        are always present in the response — fields with no data are returned as null rather than omitted. Empty arrays
        may also be returned for attributes with no values.
      title: WatchlistEntityMatch
