    search_SearchResults:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the entity
        label:
          type: string
          description: Display name of the entity
        degree:
          type: integer
          description: Number of outgoing relationships
        closed:
          type: boolean
          description: >-
            True if the entity existed in the past but not at the present time, otherwise false. Always false for data
            curation.
        entity_url:
          type: string
          description: Convenience URL to the entity in the API.
        pep:
          type: boolean
          description: >-
            True if the entity has the ["Politically Exposed Person (PEP)" risk
            factor](/sayari-library/ontology/risk-factors#politically-exposed-person-pep-), otherwise false.
        psa_id:
          type: string
        psa_count:
          type: integer
