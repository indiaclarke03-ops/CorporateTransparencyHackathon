  /v1/traversal/{id}:
    get:
      operationId: traversal_traversal
      summary: Traversal
      description: >-
        The Traversal endpoint returns paths from a single target entity to up to 50 directly or indirectly-related
        entities. Each path includes information on the 0 to 10 intermediary entities, as well as their connecting
        relationships. The response's explored_count field indicates the size of the graph subset the application
        searched. Running a traversal on a highly connected entity with a restrictive set of argument filters and a high
        max depth will require the application to explore a higher number of traversal paths, which may affect
        performance. In cases where a traversal searches over a very large, highly-connected subgraph, a partial result
        set may be returned containing only the most relevant results. This will be indicated in the response by the
        partial_results field.
      tags:
        - traversal
      parameters:
        - name: id
          in: path
          description: Unique identifier of the entity
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Limit total values for traversal. Defaults to 10. Max of 50.
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset values for traversal. Defaults to 0. Max of 1000.
          required: false
          schema:
            type: integer
        - name: min_depth
          in: query
          description: Set minimum depth for traversal. Defaults to 1.
          required: false
          schema:
            type: integer
        - name: max_depth
          in: query
          description: Set maximum depth for traversal. Defaults to 4.
          required: false
          schema:
            type: integer
        - name: relationships
          in: query
          description: >-
            Set relationship type(s) to follow when traversing related entities. Defaults to following all relationship
            types.
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Relationships'
        - name: psa
          in: query
          description: >-
            Also traverse relationships from entities that are possibly the same as any entity that appears in the path.
            Defaults to traversing possibly same as relationships.
          required: false
          schema:
            type: boolean
        - name: countries
          in: query
          description: >-
            Filter paths to only those that end at an entity associated with the specified country(ies). Defaults to
            returning paths that end in any [country](/sayari-library/ontology/enumerated-types#country).
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Country'
        - name: types
          in: query
          description: >-
            Filter paths to only those that end at an entity of the specified type(s). Defaults to returning paths that
            end at any type.
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Entities'
        - name: sanctioned
          in: query
          description: >-
            Filter paths to only those that end at an entity appearing on a watchlist. Defaults to not filtering paths
            by sanctioned status.
          required: false
          schema:
            type: boolean
        - name: pep
          in: query
          description: >-
            Filter paths to only those that end at an entity appearing on a pep list. Defaults to not filtering paths by
            pep status.
          required: false
          schema:
            type: boolean
        - name: min_shares
          in: query
          description: Set minimum percentage of share ownership for traversal. Defaults to 0.
          required: false
          schema:
            type: integer
        - name: include_unknown_shares
          in: query
          description: >-
            Also traverse relationships when share percentages are unknown. Only useful when min_shares is set greater
            than 0. Defaults to true.
          required: false
          schema:
            type: boolean
        - name: exclude_former_relationships
          in: query
          description: Include relationships that were valid in the past but not at the present time. Defaults to true.
          required: false
          schema:
            type: boolean
        - name: exclude_closed_entities
          in: query
          description: Include entities that existed in the past but not at the present time. Defaults to false.
          required: false
          schema:
            type: boolean
        - name: risk_categories
          in: query
          description: >-
            Filter paths to only those that include an entity associated with any risk factor belonging to one of the
            specified categories.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_RiskCategory'
        - name: eu_high_risk_third
          in: query
          description: Filter paths to only those that relate with an entity that we have flagged with this risk factor
          required: false
          schema:
            type: boolean
        - name: reputational_risk_modern_slavery
          in: query
          description: Filter paths to only those that relate with an entity that we have flagged with this risk factor
          required: false
          schema:
            type: boolean
        - name: state_owned
          in: query
          description: Filter paths to only those that relate with an entity that we have flagged with this risk factor
          required: false
          schema:
            type: boolean
        - name: formerly_sanctioned
          in: query
          description: Filter paths to only those that relate with an entity that we have flagged with this risk factor
          required: false
          schema:
            type: boolean
        - name: reputational_risk_terrorism
          in: query
          description: Filter paths to only those that relate with an entity that we have flagged with this risk factor
          required: false
          schema:
            type: boolean
        - name: reputational_risk_organized_crime
