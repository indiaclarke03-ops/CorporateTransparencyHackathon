  /v1/projects/{project_id}/entities:
    get:
      operationId: projectEntity_getProjectEntities
      summary: Get Project Entities
      description: >-
        Retrieves a list of entities for a specific project with pagination support.


        **Response Formats:**

        - **JSON** (default): Returns structured data with nested objects

        - **CSV**: Returns tabular data with dynamic columns for attributes and risk categories


        **CSV Format:**

        The CSV response includes dynamic columns based on the data:

        - `attribute_{field_name}`: Dynamic columns for each attribute field found in the data

        - `risk_category_{category_id}`: Dynamic columns for each risk category found in the data

        - Standard columns: project_id, project_entity_id, label, project_entity_url, upload_ids, strength, countries,
        tags, case_status, created_at, match_count, upstream_products, upstream_risk_factors, upstream_countries


        Use the `Accept: text/csv` header to request CSV format.
      tags:
        - project_entity
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: next
          in: query
          description: The pagination token for the next page of projects.
          required: false
          schema:
            type: string
        - name: prev
          in: query
          description: The pagination token for the previous page of projects.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Limit total values returned for projects. Defaults to 100. Max 100.
          required: false
          schema:
            type: integer
        - name: filter
          in: query
          description: >-
            Filter the project entities. Supports both dot notation (e.g., 'filter.attribute.name') and bracket notation
            (e.g., 'filter[attribute][name]') for nested field filtering.
          required: false
          schema:
            $ref: '#/components/schemas/projectEntity_ProjectEntitiesFilter'
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
