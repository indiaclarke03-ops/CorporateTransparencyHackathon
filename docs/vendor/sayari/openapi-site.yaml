  /v1/projects/{project_id}/entities/{project_entity_id}/supply_chain/upstream:
    get:
      operationId: projectEntity_projectEntitySupplyChain
      summary: Project Entity Supply Chain
      description: >-
        Execute a traversal of the upstream trade network (supply chain) for all matched entities of a project entity,
        returning a set of entities and edges between them.
      tags:
        - project_entity
      parameters:
        - name: project_id
          in: path
          description: The project Identifier
          required: true
          schema:
            type: string
        - name: project_entity_id
          in: path
          description: The project entity Identifier
          required: true
          schema:
            type: string
        - name: product
          in: query
          description: >-
            Product root edge filter. Filters results to include only trade relationships where the associated component
            is part of the specified product's blueprint or is a sub-component of that product.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: '-product'
          in: query
          description: >-
            Product root edge filter. Filters results to exclude any trade relationships where the associated component
            is part of the specified product's blueprint or is a sub-component of that product.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: risk
          in: query
          description: >-
            Risk leaf node filter. Only return supply chains that end with a supplier that has 1+ of the specified risk
            factors.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Risk'
        - name: '-risk'
          in: query
          description: >-
            Risk leaf node filter. Only return supply chains that end with a supplier that has none of the specified
            risk factors.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Risk'
        - name: countries
          in: query
          description: >-
            Country leaf node filter. Only return supply chains that end with a supplier in 1+ of the specified
            countries.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: '-countries'
          in: query
          description: >-
            Country leaf node filter. Only return supply chains that end with a supplier in none of the specified
            countries.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: shipment_country
          in: query
          description: Filters supply chain paths where 1+ shipment country from any tier matches the provided values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: '-shipment_country'
          in: query
          description: Filters supply chain paths where none of the shipment countries from any tier matches the provided values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: tier1_shipment_country
          in: query
          description: Filters supply chain paths where 1+ shipment country from tier 1 matches the provided values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: tier2_shipment_country
          in: query
          description: Filters supply chain paths where 1+ shipment country from tier 2 matches the provided values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: tier3_shipment_country
          in: query
          description: Filters supply chain paths where 1+ shipment country from tier 3 matches the provided values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: tier4_shipment_country
          in: query
          description: Filters supply chain paths where 1+ shipment country from tier 4 matches the provided values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: tier5_shipment_country
          in: query
          description: Filters supply chain paths where 1+ shipment country from tier 5 matches the provided values.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/generatedTypes_Country'
        - name: component
          in: query
          description: >-
            Component edge filter. Only return supply chains that contain at least one edge with 1+ of the specified HS
            codes.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: '-component'
          in: query
          description: Component edge filter. Only return supply chains that contain no edges with any of the specified HS codes.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: min_date
          in: query
          description: >-
            Minimum date edge filter in <YYYY-MM-DD> format. Only return supply chains with edge dates that are greater
            than or equal to this date.
          required: false
          schema:
            type: string
        - name: max_date
          in: query
          description: >-
            Maximum date edge filter in <YYYY-MM-DD> format. Only return supply chains with edge dates that are less
            than or equal to this date.
          required: false
          schema:
            type: string
        - name: max_depth
          in: query
          description: The maximum depth of the traversal, from 1 to 4 inclusive. Default is 4. Reduce if query is timing out.
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: The maximum number of results to return. Default is no limit.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supplyChain_UpstreamTradeTraversalResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_BadRequestResponse'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_UnauthorizedResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_NotFoundResponse'
        '405':
          description: Error response with status 405
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_MethodNotAllowedResponse'
        '429':
          description: Error response with status 429
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_RateLimitResponse'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_InternalServerErrorResponse'
      security:
        - default: []
