          type: array
          items:
            $ref: '#/components/schemas/generatedTypes_CompanyStatus'
          description: Filter by entity [company status](/sayari-library/ontology/enumerated-types#company-status).
        bounds:
          type: string
          description: >-
            Filter by a geographical bounding box. The value is a pipe-delimited set of four values representing the
            top, left, bottom, and right sides of the bounding box, in that order. The pipes should be URL-encoded as
            `%7C`. The top coordinate must greater than the bottom coordinate, and the left coordinate must be less than
            the right coordinate. A sample is
            `55.680357237879136|-71.53607290158526|41.10876347746233|-40.963927098414736`
        match_entity_id:
          type: array
          items:
            type: string
