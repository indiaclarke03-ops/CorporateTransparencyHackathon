        '520':
          description: Error response with status 520
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_ConnectionErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/attributes_AddAttribute'
      security:
        - default: []
