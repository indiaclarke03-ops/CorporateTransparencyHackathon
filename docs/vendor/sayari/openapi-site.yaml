  /oauth/token:
    post:
      operationId: auth_getToken
      summary: Get Token
      description: Hit the auth endpoint to get a bearer token
      tags:
        - auth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth_AuthResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_BadRequestResponse'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_UnauthorizedResponse'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_InternalServerErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                audience:
                  type: string
                  enum:
                    - sayari.com
                grant_type:
                  type: string
                  enum:
                    - client_credentials
              required:
                - client_id
                - client_secret
                - audience
                - grant_type
  /v1/entity/{id}:
    get:
      operationId: entity_getEntity
      summary: Get Entity
      description: >-
        <Note>To retrieve a L1 Due Dilligence PDF Report. Include 'Accept: application/pdf' in request headers.</Note>
        Retrieve an entity profile from the database based on the entity ID. This endpoint returns the full profile,
        entity_summary returns the same payload minus relationships.
      tags:
        - entity
      parameters:
        - name: id
          in: path
          description: Unique identifier of the entity
          required: true
          schema:
            type: string
        - name: attributes.additional_information.next
          in: query
          description: The pagination token for the next page of attribute `additional_information`.
          required: false
          schema:
            type: string
        - name: attributes.additional_information.prev
          in: query
          description: The pagination token for the previous page of attribute `additional_information`.
          required: false
          schema:
            type: string
        - name: attributes.additional_information.limit
          in: query
          description: Limit total values returned for attribute `additional_information`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: attributes.address.next
          in: query
          description: The pagination token for the next page of attribute `address`.
          required: false
          schema:
            type: string
        - name: attributes.address.prev
          in: query
          description: The pagination token for the previous page of attribute `address`.
          required: false
          schema:
            type: string
        - name: attributes.address.limit
          in: query
          description: Limit total values returned for attribute `address`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: attributes.business_purpose.next
          in: query
          description: The pagination token for the next page of attribute `business_purpose`.
          required: false
          schema:
            type: string
        - name: attributes.business_purpose.prev
          in: query
          description: The pagination token for the previous page of attribute `business_purpose`.
          required: false
          schema:
            type: string
        - name: attributes.business_purpose.limit
          in: query
          description: Limit total values returned for attribute `business_purpose`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: attributes.company_type.next
          in: query
          description: The pagination token for the next page of attribute `company_type`.
          required: false
          schema:
            type: string
        - name: attributes.company_type.prev
          in: query
          description: The pagination token for the previous page of attribute `company_type`.
          required: false
          schema:
            type: string
        - name: attributes.company_type.limit
          in: query
          description: Limit total values returned for attribute `company_type`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: attributes.country.next
          in: query
          description: The pagination token for the next page of attribute `country`.
          required: false
          schema:
            type: string
        - name: attributes.country.prev
          in: query
          description: The pagination token for the previous page of attribute `country`.
          required: false
          schema:
            type: string
        - name: attributes.country.limit
          in: query
          description: Limit total values returned for attribute `country`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: attributes.identifier.next
          in: query
          description: The pagination token for the next page of attribute `identifier`.
          required: false
          schema:
            type: string
        - name: attributes.identifier.prev
          in: query
          description: The pagination token for the previous page of attribute `identifier`.
          required: false
          schema:
            type: string
        - name: attributes.identifier.limit
          in: query
          description: Limit total values returned for attribute `identifier`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: attributes.name.next
          in: query
          description: The pagination token for the next page of attribute `name`.
          required: false
          schema:
            type: string
        - name: attributes.name.prev
          in: query
          description: The pagination token for the previous page of attribute `name`.
          required: false
          schema:
            type: string
        - name: attributes.name.limit
          in: query
          description: Limit total values returned for attribute `name`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: attributes.status.next
          in: query
          description: The pagination token for the next page of attribute `status`.
          required: false
          schema:
            type: string
        - name: attributes.status.prev
          in: query
          description: The pagination token for the previous page of attribute `status`.
          required: false
          schema:
            type: string
        - name: attributes.status.limit
          in: query
          description: Limit total values returned for attribute `status`. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: relationships.next
          in: query
          description: The pagination token for the next page of relationship results
          required: false
          schema:
            type: string
        - name: relationships.prev
          in: query
          description: The pagination token for the previous page of relationship results
          required: false
          schema:
            type: string
        - name: relationships.limit
          in: query
          description: Limit total relationship values. Defaults to 50.
          required: false
          schema:
            type: integer
        - name: relationships.type
          in: query
          description: >-
            Filter relationships to [relationship type](/sayari-library/ontology/relationships), e.g. director_of or
            has_shareholder
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Relationships'
        - name: relationships.sort
          in: query
          description: Sorts relationships by As Of date or Shareholder percentage, e.g. date or -shares
          required: false
          schema:
            type: string
        - name: relationships.startDate
          in: query
          description: Filters relationships to after a date
          required: false
          schema:
            type: string
            format: date
        - name: relationships.endDate
          in: query
          description: Filters relationships to before a date
          required: false
          schema:
            type: string
            format: date
        - name: relationships.minShares
          in: query
          description: Filters relationships to greater than or equal to a Shareholder percentage
          required: false
          schema:
            type: integer
        - name: relationships.country
          in: query
          description: Filters relationships to a list of [countries](/sayari-library/ontology/enumerated-types#country)
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Country'
        - name: relationships.arrivalCountry
          in: query
          description: >-
            Filters shipment relationships to a list of arrival
            [countries](/sayari-library/ontology/enumerated-types#country)
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Country'
        - name: relationships.arrivalState
          in: query
          description: Filters shipment relationships to an arrival state
          required: false
          schema:
            type: string
        - name: relationships.arrivalCity
          in: query
          description: Filters shipment relationships to an arrival city
          required: false
          schema:
            type: string
        - name: relationships.departureCountry
          in: query
          description: >-
            Filters shipment relationships to a list of departure
            [countries](/sayari-library/ontology/enumerated-types#country)
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Country'
        - name: relationships.departureState
          in: query
          description: Filters shipment relationships to a departure state
          required: false
          schema:
            type: string
        - name: relationships.departureCity
          in: query
          description: Filters shipment relationships to a departure city
          required: false
          schema:
            type: string
        - name: relationships.partnerName
          in: query
          description: Filters shipment relationships to a trade partner name
          required: false
          schema:
            type: string
        - name: relationships.partnerRisk
          in: query
          description: Filters shipment relationships to a trade partner [risk tag](/sayari-library/ontology/enumerated-types#tag)
          required: false
          schema:
            $ref: '#/components/schemas/generatedTypes_Risk'
        - name: relationships.hsCode
          in: query
          description: Filters shipment relationships to an HS code
          required: false
          schema:
            type: string
        - name: possibly_same_as.next
          in: query
          description: The pagination token for the next page of possibly same entities.
          required: false
          schema:
            type: string
        - name: possibly_same_as.prev
          in: query
          description: The pagination token for the previous page of possibly same entities.
          required: false
          schema:
            type: string
        - name: possibly_same_as.limit
          in: query
          description: Limit total possibly same as entities. Defaults to 100.
          required: false
          schema:
            type: integer
        - name: referenced_by.next
          in: query
          description: The pagination token for the next page of the entity's referencing records
          required: false
          schema:
            type: string
        - name: referenced_by.prev
          in: query
          description: The pagination token for the previous page of the entity's referencing records
          required: false
          schema:
            type: string
        - name: referenced_by.limit
          in: query
          description: Limit totals values returned for entity's referencing records. Defaults to 100.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entity_GetEntityResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_BadRequestResponse'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_UnauthorizedResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_NotFoundResponse'
        '405':
          description: Error response with status 405
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_MethodNotAllowedResponse'
        '429':
          description: Error response with status 429
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_RateLimitResponse'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sharedErrors_InternalServerErrorResponse'
      security:
        - default: []
